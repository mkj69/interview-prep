<div class="mobile-head"><a href="index.html">← 路线图</a><span style="font:12px var(--mono)">间隔重复复习</span></div>
<div class="shell">
  <aside class="rail">
    <a class="brand" href="index.html"><span class="brand-logo">Prep<i>.</i></span><small>RS INTERVIEW<br>NOTEBOOK</small></a>
    <div>
      <p class="rail-label">Start</p>
      <nav>
        <a href="index.html"><span class="num">··</span>路线图与学习计划</a>
        <a href="review.html" class="active"><span class="num">↻</span>间隔重复复习</a>
      </nav>
    </div>
    <div>
      <p class="rail-label">Modules</p>
      <nav id="module-nav"></nav>
    </div>
    <div class="rail-footer"><a href="https://mkj69.github.io/">← mkj69.github.io</a></div>
  </aside>
  <main>
    <div class="page">
      <div class="eyebrow">Spaced repetition</div>
      <h1 class="title">每天先清<em>复习队列</em></h1>
      <p class="lede">按遗忘曲线安排：标"不会"的卡马上再出现；"模糊"明天再出现；"会了"的间隔依次拉长到 2、5、12、25、50 天。快捷键：空格看答案，1 / 2 / 3 打分。</p>
      <div class="review-stage">
        <div class="review-bar">
          <label>范围 <select id="review-deck"><option value="all">全部模块</option></select></label>
          <label><input type="checkbox" id="review-due" checked> 只看到期的卡</label>
          <span id="review-count"></span>
          <button class="chip-btn" id="review-reset" type="button">重置记录</button>
        </div>
        <div id="review"></div>
      </div>
      <p style="font-size:13px;color:var(--muted)">复习记录只保存在当前浏览器里（localStorage），换设备或清除浏览器数据会重置。</p>
    </div>
  </main>
</div>
